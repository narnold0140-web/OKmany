# Hetente megnézi, van-e új hatályos változata az uniós vízumlistának (2018/1806 rendelet) az EUR-Lexen.
# Ha van, nyit egy „Issue”-t a repóban (erről a GitHub e-mailt küld), és akkor frissíteni kell az app listáját.
name: Vízumlista-figyelő
on:
  schedule:
    - cron: '17 5 * * 1'      # minden hétfőn reggel
  workflow_dispatch: {}        # kézzel is indítható (Actions fül → Run workflow)
permissions:
  contents: read
  issues: write
jobs:
  figyel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vízumlista ellenőrzése
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          ISMERT=$(cat .github/vizumlista-allapot.txt 2>/dev/null | tr -d '[:space:]')
          [ -z "$ISMERT" ] && ISMERT="2025-12-30"
          LEGUJABB=""
          for URL in "https://eur-lex.europa.eu/eli/reg/2018/1806/oj/eng" "https://eur-lex.europa.eu/eli/reg/2018/1806/oj"; do
            HTML=$(curl -sfL --max-time 60 -A "Mozilla/5.0 (vizumlista-figyelo)" "$URL" || true)
            D=$(printf '%s' "$HTML" | grep -oE 'eli/reg/2018/1806/20[0-9]{2}-[0-9]{2}-[0-9]{2}' | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | sort -u | tail -1)
            if [ -n "$D" ]; then LEGUJABB="$D"; break; fi
          done
          if [ -z "$LEGUJABB" ]; then
            echo "Az EUR-Lex most nem volt elérhető vagy megváltozott az oldala; jövő héten újra próbálja."
            exit 0
          fi
          echo "Ismert változat: $ISMERT | legújabb az EUR-Lexen: $LEGUJABB"
          if [[ "$LEGUJABB" > "$ISMERT" ]]; then
            CIM="Vízumlista: új hatályos változat ($LEGUJABB)"
            if gh issue list --state open --search "$CIM in:title" --json number --jq 'length' | grep -q '^0$'; then
              gh issue create --title "$CIM" --body "Az uniós vízumlistának (2018/1806 rendelet) új hatályos változata jelent meg: $LEGUJABB.
          Az appban lévő lista ennél régebbi ($ISMERT). Kérd meg Claude-ot a lista frissítésére, és utána írd át a .github/vizumlista-allapot.txt fájlt erre a dátumra.
          Link: https://eur-lex.europa.eu/eli/reg/2018/1806/$LEGUJABB"
            fi
          else
            echo "Nincs változás."
          fi
